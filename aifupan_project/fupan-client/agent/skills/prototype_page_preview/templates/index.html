<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{PAGE_TITLE}}</title>
  <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css" />
  <link id="proto-css" rel="stylesheet" href="{{PROTOTYPE_CSS_HREF}}" />
  <style>
    html, body { height: 100%; margin: 0; background: #f5f7fa; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial; }
    .page { height: 100%; display: flex; flex-direction: column; }
    header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ebeef5; font-weight: 600; }
    main { flex: 1; overflow: auto; padding: 16px; }
    #app { background: #fff; border: 1px solid #ebeef5; border-radius: 8px; padding: 16px; height: 600px; }
  </style>
</head>
<body>
  <div class="page">
    <header>{{PAGE_TITLE}}</header>
    <main>
      <div id="app"></div>
    </main>
  </div>
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/element-plus"></script>
  <script>
    (function(){
      const fit = {{FIT}};
      const heightMode = '{{HEIGHT_MODE}}';
      const fixedHeight = {{FIXED_HEIGHT}};
      const PAGE_TYPE = '{{PAGE_TYPE}}';
      const PAGE_SCHEMA = {{PAGE_SCHEMA}};
      const MOCK_DATA = {{MOCK_DATA}};
      const container = document.getElementById('app');
      const headerEl = document.querySelector('header');
      function setContainerSize(){
        if(heightMode === 'viewport'){
          const headerH = headerEl ? headerEl.offsetHeight : 0;
          const padding = 16 * 2;
          const available = Math.max(300, window.innerHeight - headerH - padding - 16);
          container.style.height = available + 'px';
        } else {
          container.style.height = (fixedHeight && fixedHeight > 0 ? fixedHeight : 800) + 'px';
        }
      }
      window.addEventListener('resize', setContainerSize);
      setContainerSize();
      const app = Vue.createApp({
        data(){
          return { schema: PAGE_SCHEMA || {}, data: MOCK_DATA || {}, filters: {}, formModel: {} }
        },
        computed:{
          pageType(){ return (PAGE_TYPE || this.schema.page_type || '').toLowerCase() },
          filterFields(){ return (this.schema.filters || []) },
          tableColumns(){ return (this.schema.table && this.schema.table.columns) ? this.schema.table.columns : [] },
          listData(){ return this.data.list || [] },
          metrics(){ return this.data.metrics || [] }
        },
        methods:{
          fieldComp(t){
            if(t==='number') return 'el-input-number'
            if(t==='select') return 'el-select'
            if(t==='date' || t==='daterange') return 'el-date-picker'
            return 'el-input'
          },
          pickerType(t){ if(t==='daterange') return 'daterange'; if(t==='date') return 'date'; return 'date' }
        },
        template:`
          <el-container style="height:100%">
            <el-header>
              <el-form v-if="filterFields.length" class="form-inline" inline label-width="80px">
                <template v-for="f in filterFields" :key="f.prop">
                  <el-form-item :label="f.label">
                    <component :is="fieldComp(f.type)" v-model="filters[f.prop]" :placeholder="f.placeholder || ''" :type="pickerType(f.type)">
                      <el-option v-for="opt in (f.options||[])" :key="opt.value" :label="opt.label" :value="opt.value" />
                    </component>
                  </el-form-item>
                </template>
                <el-form-item>
                  <el-button type="primary">查询</el-button>
                  <el-button>重置</el-button>
                </el-form-item>
              </el-form>
            </el-header>
            <el-main>
              <template v-if="pageType==='列表页' || pageType==='list' || tableColumns.length">
                <div class="panel">
                  <el-table :data="listData" style="width:100%">
                    <el-table-column v-for="c in tableColumns" :key="c.prop" :prop="c.prop" :label="c.label" :width="c.width || ''"/>
                  </el-table>
                  <div class="mt-16">
                    <el-pagination layout="prev, pager, next" :total="(data.total||listData.length)" />
                  </div>
                </div>
              </template>
              <template v-else-if="pageType==='表单页' || pageType==='form'">
                <div class="panel">
                  <el-form label-width="100px" style="max-width:640px">
                    <template v-for="f in (schema.form && schema.form.fields || [])" :key="f.prop">
                      <el-form-item :label="f.label">
                        <component :is="fieldComp(f.type)" v-model="formModel[f.prop]" :placeholder="f.placeholder || ''" :type="pickerType(f.type)">
                          <el-option v-for="opt in (f.options||[])" :key="opt.value" :label="opt.label" :value="opt.value" />
                        </component>
                      </el-form-item>
                    </template>
                    <el-form-item>
                      <el-space>
                        <el-button type="primary">保存</el-button>
                        <el-button>重置</el-button>
                      </el-space>
                    </el-form-item>
                  </el-form>
                </div>
              </template>
              <template v-else>
                <div class="grid grid-3 mb-16" v-if="metrics.length">
                  <div class="panel" v-for="m in metrics" :key="m.key">
                    <div class="panel-title">{{m.label}}</div>
                    <div class="chart-placeholder">{{m.value}}</div>
                  </div>
                </div>
                <div class="panel"><div class="prototype-slot">此处由生成器插入页面布局内容</div></div>
              </template>
            </el-main>
          </el-container>
        `
      });
      app.use(ElementPlus);
      app.mount('#app');
    })();
  </script>
</body>
</html>

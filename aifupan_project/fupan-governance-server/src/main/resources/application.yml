server:
  port: 0
  shutdown: GRACEFUL
  forward-headers-strategy: framework
logging:
  file:
    path: ./

## web 配置
spring:
  application:
    name: governance
  # 环境 dev|local|prod
  profiles:
    active: local
  # jackson时间格式化
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 30MB
      enabled: true
  task:
    execution:
      thread-name-prefix: aifupan-task-
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # 优雅关闭
  main:
    lazy-initialization: true
    web-application-type: servlet
  lifecycle:
    # 优雅停机宽限期时间
    timeout-per-shutdown-phase: 30s

---
## 数据库
spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      minimum-idle: ${db.min-size:10}
      maximum-pool-size: ${db.max-size:30}
      auto-commit: true
      idle-timeout: 30000
      pool-name: HikariCP
      max-lifetime: ${db.max-lifetime:900000}
      connection-timeout: 10000
      validation-timeout: 1000
      keepalive-time: ${db.keepalive-time:60000}
      connection-init-sql: SELECT 1
      connection-test-query: SELECT 1
    url: ${db.url-prefix:jdbc}:${db.databases-type:mysql}://${db.host}/${db.name}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${db.username}
    password: ${db.password}
    driver-class-name: ${db.driver-class-name:com.mysql.cj.jdbc.Driver}

# mybatis
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  #实体扫描，多个package用逗号或者分号分隔
  typeAliasesPackage: com.jiuyu.**.entity
  global-config:
    #数据库相关配置
    db-config:
      #主键类型  AUTO:"数据库ID自增", INPUT:"用户输入ID", ASSIGN_ID:"全局唯一ID (数字类型唯一ID)", UUID:"全局唯一ID UUID";
      id-type: ASSIGN_ID
      logic-delete-value: -1
      logic-not-delete-value: 0
    banner: false
  #原生配置
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    default-fetch-size: 1000

---
spring:
  data:
    redis:
      host: ${redis.ip}
      password: ${redis.password}
      port: ${redis.port:6379}
      database: ${redis.database:0}
      timeout: 1000ms  # 连接超时时长（毫秒）
      jedis:
        pool:
          max-active: 128  # 连接池最大连接数（使用负值表示没有限制）
          max-wait: 300ms      # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-idle: 12      # 连接池中的最大空闲连接
          min-idle: 1       # 连接池中的最小空闲连接
          time-between-eviction-runs: 300s

jiuyu:
  lock:
    type: redis
    retry:
      interval: 1000ms
      attempts: 10
    redis:
      prefix: "jiuyu:lock:"
  http:
    client:
      enabled: true
  signature:
    overdue-time: 600000
    app-name: X-App-Id
    sign-name: X-Signature
    time-name: X-Timestamp
    model-name: X-Sign-Type
    nonce-name: X-Nonce



jasypt:
  encryptor:
    algorithm: PBEWithMD5AndDES
    iv-generator-classname: org.jasypt.iv.NoIvGenerator

# xxl-job 配置
xxl:
  job:
    enable: true
    admin:
      # 调度中心部署地址，多个逗号分隔
      addresses: ${xxl.job.admin.addresses:xx}
      # 调度中心通讯TOKEN
      access-token: ${xxl.job.admin.access-token:xx}
      # 请求超时时间（秒）
      timeout: ${xxl.job.admin.timeout:3}
    executor:
      # 执行器AppName
      app-name: ${xxl.job.executor.app-name:governance-api-jobhandler}
      # 执行器注册地址（留空自动获取）
      address: ''
      # 执行器IP（留空自动获取）
      ip: ''
      # 执行器端口号
      port: ${xxl.job.executor.port:9999}
      # 执行器日志存储路径
      log-path: ${xxl.job.executor.log-path:/logs/governance-xxl-job/jobhandler}
      # 执行器日志保留天数
      log-retention-days: ${xxl.job.executor.log-retention-days:30}
